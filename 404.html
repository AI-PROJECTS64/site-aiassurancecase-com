<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>aiassurancecase.com - 404</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root{
      --bg:#050816;
      --panel:rgba(255,255,255,.05);
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.70);
      --accent:#63e6ff;
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --radius:24px;
      --max:820px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(99,230,255,.12), transparent 60%),
        radial-gradient(800px 500px at 90% 15%, rgba(124,92,255,.10), transparent 55%),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }
    .card{
      max-width:var(--max);
      width:100%;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-radius:var(--radius);
      padding:22px 18px;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .logo{
      width:74px;height:74px;object-fit:contain;
      filter: drop-shadow(0 18px 38px rgba(0,0,0,.55));
      margin-bottom:10px;
    }
    h1{margin:6px 0 6px; font-size:28px; letter-spacing:-.02em}
    p{margin:10px 0; color:var(--muted)}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:11px 14px;
      border-radius:999px;
      border:1px solid rgba(99,230,255,.55);
      text-decoration:none;
      color:#03101a;
      background:linear-gradient(180deg, rgba(99,230,255,.95), rgba(99,230,255,.65));
      font-weight:800;
      font-size:13px;
      box-shadow:0 14px 34px rgba(99,230,255,.16);
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo-aiassurancecase.png" alt="aiassurancecase.com" loading="eager" />
    <h1>404 - Page not found</h1>
    <p>This page does not exist. Return to the homepage.</p>
    <a class="btn" href="/">Back to aiassurancecase.com</a>
  </div>
</body>
</html>
